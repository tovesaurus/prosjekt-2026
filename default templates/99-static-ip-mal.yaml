# Mal for statisk IP
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        # Static IP
        - 10.0.0.XX/24
      routes:
        - to: default
          via: 10.0.0.138
      nameservers:
        addresses:
          # DNS
          - 10.0.0.60
        search:
          # Domain Controller
          - ad.andoraarkitekter.no