---
# This playbook installs Borg on backupservers and fileshareservers
- name: Install Borg
  hosts: backupserver:samba_fileshare
  become: true

  tasks:
    - name: Install Borg and Borgmatic
      ansible.builtin.apt:
        name: 
          - borgbackup
          - borgmatic
        state: present
        update_cache: true