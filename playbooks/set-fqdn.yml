---
# This playbook sets Fully Qualified Domain Name for new fileshareservers

- name: Set FQDN
  hosts: new_fileshares
  become: true
  gather_facts: false
  
  tasks:
  - name: Set FQDN in /etc/hosts
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127\.0\.1\.1|^{{ ip_address }}'
      line: "{{ ansible_host }}   {{ short_name }}.{{ domain_name }}   {{ short_name }}"